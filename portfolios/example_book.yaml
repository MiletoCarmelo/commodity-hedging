# Example book of APOs, read by cmdty.load_portfolio and hedged by the bot.
# Illustrative terms. Brent appears in all three trades, so the bot nets it.

portfolio: example-book

trades:
  - id: APO-001                 # outright: bought Brent put on the January average
    type: apo
    quantity: 20000             # bbl, positive = bought
    legs:
      - underlying: BRENT
    strike: 72.0                # $/bbl
    option_type: put
    premium_style: upfront
    schedule:
      pricing_period: 2027-01
      calendar: [ICE-EU]
      pay_lag: 5

  - id: APO-002                 # WTI - Brent spread: sold put on the April average
    type: apo
    quantity: -15000            # bbl, negative = sold
    legs:
      - underlying: WTI
        weight: 1
      - underlying: BRENT
        weight: -1
    strike: -4.0                # $/bbl, spreads can have negative strikes
    option_type: put
    premium_style: futures_style
    schedule:
      pricing_period: 2027-04
      calendar: [NYMEX, ICE-EU]
      pay_lag: 5

  - id: APO-003                 # HO - Brent crack: sold call on the June average
    type: apo
    quantity: -25000
    legs:
      - underlying: HO
        weight: 1
      - underlying: BRENT
        weight: -1
    strike: 32.0
    option_type: call
    premium_style: upfront
    schedule:
      pricing_period: 2027-06
      calendar: [NYMEX, ICE-EU] # names or MICs, each exchange once
      pay_lag: 5                # business days after the last fixing
